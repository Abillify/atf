name: Supply-chain release

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.0

jobs:
  guard:
    name: Verify release tag, checkout, and CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - id: guard
        name: Enforce exact SHA, main ancestry, package version, and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          test "$GITHUB_REF_NAME" = "v$version"

          ci_ok=false
          for attempt in $(seq 1 30); do
            if test "$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch=main -f event=push -f per_page=100 \
              --jq ".workflow_runs | any(.head_sha == \"$GITHUB_SHA\" and .status == \"completed\" and .conclusion == \"success\")")" = true; then
              ci_ok=true
              break
            fi
            echo "Waiting for successful CI push run for $GITHUB_SHA (attempt $attempt/30)"
            sleep 20
          done
          test "$ci_ok" = true
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Verify public release tree with confidential rules
        env:
          ATF_REDACTION_RULES_JSON: ${{ secrets.ATF_REDACTION_RULES_JSON }}
        run: |
          set -euo pipefail
          test -n "$ATF_REDACTION_RULES_JSON"
          umask 077
          rules="$RUNNER_TEMP/atf-redaction-rules.json"
          printf '%s' "$ATF_REDACTION_RULES_JSON" > "$rules"
          bun run scripts/verify-public-tree.ts --require-rules --rules "$rules"

  workspace:
    name: Workspace inventory (${{ matrix.platform }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-14
            platform: darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # The desktop outpost's Rust crates belong in the SBOM like the npm
      # packages (CI generates the reference the same way).
      - name: Fetch crate archives for the inventory
        run: cargo fetch --locked --manifest-path apps/outpost-desktop/src-tauri/Cargo.toml
      - name: Generate workspace inventory
        run: >-
          bun run supply-chain --inventory-root "$GITHUB_WORKSPACE"
          --output-dir "$GITHUB_WORKSPACE/release/workspace-${{ matrix.platform }}-${GITHUB_SHA}"
          --platform "${{ matrix.platform }}" --assert-host-platform
          --artifact-kind workspace --artifact-name "workspace-${{ matrix.platform }}-${GITHUB_SHA}"
          --git-sha "$GITHUB_SHA" --include-cargo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-workspace-${{ matrix.platform }}-${{ github.sha }}
          path: release/workspace-${{ matrix.platform }}-${{ github.sha }}
          retention-days: 14

  images:
    name: Quickstart image inventories
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build and extract final-target inventories
        run: >-
          bun run supply-chain:images --output-dir "$GITHUB_WORKSPACE/release/quickstart-images-linux-x64-${GITHUB_SHA}"
          --platform linux-x64 --git-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-quickstart-images-linux-x64-${{ github.sha }}
          path: release/quickstart-images-linux-x64-${{ github.sha }}
          retention-days: 14

  # Production container images (Requirement 13.1): every service image is
  # pushed to GHCR, signed with cosign keyless (the OIDC id-token is the
  # identity — no long-lived signing key), and carries SLSA build provenance
  # plus a CycloneDX SBOM attestation in the registry. Images are tagged with
  # the release version and the exact SHA; the digest is what gets signed and
  # attested, so a retag can never invalidate the signature.
  container-images:
    name: Container images (${{ matrix.service }})
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service: [runtime, search, gate, extract, control]
    env:
      IMAGE: ghcr.io/abillify/atf-${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/images/Dockerfile.${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: >-
            ${{ env.IMAGE }}:${{ needs.guard.outputs.version }},
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.service }}
          cache-to: type=gha,scope=release-${{ matrix.service }},mode=max
          provenance: false
          sbom: false
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign image (keyless)
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"
      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: atf-${{ matrix.service }}.cdx.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: atf-${{ matrix.service }}.cdx.json
          push-to-registry: true
      # The component SBOM above covers software identity; it does not assert
      # license findings, and it says nothing about the OS packages the image
      # installs (the extract image ships poppler and LibreOffice). This scan
      # inventories the effective license of every OS package in the final
      # image so the release bundle carries a per-image license record; see
      # docs/IMAGE-LICENSES.md for the compliance reasoning.
      - name: Install Trivy (pinned by checksum)
        run: |
          set -euo pipefail
          version=0.75.0
          expected=c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
          archive=trivy_${version}_Linux-64bit.tar.gz
          curl -fsSL -o "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${version}/${archive}"
          echo "${expected}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" trivy
          sudo install trivy /usr/local/bin/trivy
          trivy --version
      - name: Generate image license SBOM (CycloneDX)
        run: >-
          trivy image --scanners license --format cyclonedx
          --output atf-${{ matrix.service }}-licenses.cdx.json
          --slow --timeout 20m
          "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-image-licenses-${{ matrix.service }}-${{ github.sha }}
          path: atf-${{ matrix.service }}-licenses.cdx.json
          retention-days: 14

  publish:
    name: Publish supply-chain bundle
    needs: [guard, workspace, images, container-images]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      # Keyless attestation of the bundle (GitHub artifact attestations).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Re-assert release guard
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$GITHUB_REF_NAME" = "v$(bun -e 'console.log((await Bun.file("package.json").json()).version)' )"
      # The atf-verify binary below bundles workspace packages and npm
      # dependencies (zod, @atf/canonical-json, @atf/security-kit); without an
      # install `bun build --compile` cannot resolve them.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*-${{ github.sha }}
          path: staging/bundle
      # The offline verifier ships as a standalone Linux x64 binary so third
      # parties can verify decision receipts, evidence bundles, erasure
      # receipts and audit exports without a Bun checkout. Building it into
      # the bundle directory includes it in CHECKSUMS.sha256 and the attested
      # tarball; the same file is uploaded as a release asset.
      - name: Build atf-verify Linux x64 binary
        run: |
          set -euo pipefail
          bun build --compile scripts/atf-verify.ts --outfile dist/bin/atf-verify-linux-x64
          dist/bin/atf-verify-linux-x64 --help >/dev/null
          cp dist/bin/atf-verify-linux-x64 staging/bundle/atf-verify-linux-x64
      - name: Create checksummed bundle
        run: |
          set -euo pipefail
          cd staging/bundle
          find . -type f ! -name CHECKSUMS.sha256 -print0 | sort -z | xargs -0 sha256sum > CHECKSUMS.sha256
          cd ../..
          tar -czf "atf-supply-chain-${GITHUB_REF_NAME}-${GITHUB_SHA}.tar.gz" -C staging/bundle .
          sha256sum "atf-supply-chain-${GITHUB_REF_NAME}-${GITHUB_SHA}.tar.gz" > "atf-supply-chain-${GITHUB_REF_NAME}-${GITHUB_SHA}.tar.gz.sha256"
      # The bundle is the evidence that backs the release; unsigned, a changed
      # bundle would be indistinguishable from the original. The provenance
      # attestation binds the tarball digest to this workflow run and commit
      # (verify with `gh attestation verify <bundle> --repo Abillify/atf`).
      - name: Attest supply-chain bundle provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # The verifier binary is also a standalone release asset, so it is
          # attested on its own (`gh attestation verify atf-verify-linux-x64`).
          subject-path: |
            atf-supply-chain-${{ github.ref_name }}-${{ github.sha }}.tar.gz
            staging/bundle/atf-verify-linux-x64
      # The release notes are the version's own CHANGELOG section, not an
      # auto-generated list of pull requests. A missing or empty section fails
      # the job before anything is published.
      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v header="## [${version}]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no (or an empty) section for ${version}." >&2
            exit 1
          fi
      - name: Create immutable release entry and upload bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; published releases are not overwritten." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file release-notes.md \
            "atf-supply-chain-${GITHUB_REF_NAME}-${GITHUB_SHA}.tar.gz" \
            "atf-supply-chain-${GITHUB_REF_NAME}-${GITHUB_SHA}.tar.gz.sha256" \
            "staging/bundle/atf-verify-linux-x64"
