name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.0
  NODE_VERSION: 26

jobs:
  # Cheap, fast gates. Kept separate so a missing SPDX header or a stale generated artifact
  # reports in under a minute instead of behind the test matrix.
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Verify contributor assignment acceptance trailers
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          commits_file="$(mktemp)"
          trap 'rm -f "$commits_file"' EXIT
          git rev-list "$BASE_SHA..$HEAD_SHA" > "$commits_file"
          test -s "$commits_file"
          while IFS= read -r commit; do
            trailers="$(git show -s --format=%B "$commit" | git interpret-trailers --parse)"
            assignment_count="$(printf '%s\n' "$trailers" \
              | grep -Ec '^ATF-Contributor-Assignment-Accepted:' || true)"
            valid_count="$(printf '%s\n' "$trailers" \
              | grep -Ec '^ATF-Contributor-Assignment-Accepted: 1\.0, [^ <>][^<>]* <[^ <>@]+@[^ <>@]+>$' || true)"
            if [[ "$assignment_count" -ne 1 || "$valid_count" -ne 1 ]]; then
              echo "Missing or invalid contributor assignment trailer on commit $commit." >&2
              echo "Expected exactly: ATF-Contributor-Assignment-Accepted: 1.0, Full Name <name@example.com>" >&2
              echo "The trailer records a separately executed Agreement 1.0; it does not execute the Agreement." >&2
              failed=1
            fi
          done < "$commits_file"
          test "$failed" -eq 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      # Runs without a redaction rule set: structural rules apply and literal redaction is
      # skipped with a warning. The rule set is confidential and is only present on the machine
      # that publishes a release, which runs `verify:public:release` instead.
      - name: Public-tree verification
        run: bun run verify:public

      # A flow change (including its prompt/sub-flow includes) must raise
      # metadata.version — the version identifies the revision in traces and
      # receipts. Compared against the PR base, or the previous push. The check fails
      # closed in CI when no base is available; a manual run compares against main.
      - name: Flow version check
        env:
          FLOW_VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: bun run check:flow-versions

      - name: SPDX headers
        run: bun run verify:spdx
      # The product version is repeated in badge URLs, prose, a Zod default and two
      # MCP client identities, none of which can import it. Releases 0.1.2 and 0.1.3
      # shipped with Search's OpenAPI document and Gate's server identity still
      # announcing 0.1.1 because nothing compared them.
      - name: Product version consistency
        run: bun run verify:version

      # Req 10.7: the workspace inventory also contains the Rust dependencies
      # from Cargo.lock; this requires the crate archives in the local registry
      # cache (cargo fetch downloads them without compiling).
      - name: Fetch crate archives for the inventory
        run: cargo fetch --locked --manifest-path apps/outpost-desktop/src-tauri/Cargo.toml

      - name: Third-party notices, SBOM, and license policy
        run: >-
          bun run supply-chain:check --inventory-root "$GITHUB_WORKSPACE"
          --output-dir "$GITHUB_WORKSPACE" --platform linux-x64 --assert-host-platform
          --artifact-kind workspace --artifact-name workspace-linux-x64
          --git-sha unknown --include-cargo

      - name: Configuration reference is current
        run: bun run config-reference:check

      - name: Flow reference and flow schema are current
        run: bun run flow-reference:check

      # Req 14.3: the Runtime route-group table in ARCHITECTURE.md is generated
      # from the real router tree and must not drift.
      - name: Runtime route reference is current
        run: bun run route-reference:check

      # Req 11.7: the committed OpenAPI baselines under docs/openapi/ are
      # regenerated from the live builders and compared for breaking changes.
      - name: OpenAPI compatibility
        run: bun run openapi:check

      # A regression gate, not a zero-findings gate. The tree carries pre-existing Biome
      # findings recorded in .biome-baseline.json; this fails only when they grow. The formatter
      # is intentionally excluded — see scripts/check-lint-baseline.ts.
      - name: Lint regression gate
        run: bun run lint:baseline

      # Req 13.8: knip keeps the dependency graph honest — unreachable files and
      # undeclared/unused dependencies fail the build. Unused-export reporting is
      # off by design (see knip.json); exported APIs are consumed by tests and
      # external code.
      - name: Unused files and dependencies (knip)
        run: bun run knip

      # Req 7.1/7.2: every outbound call in the runtime must go through the
      # Egress_Guard; a bare global fetch() would bypass SSRF protection.
      - name: No raw fetch outside the Egress_Guard
        run: bun run check:raw-fetch

      # Req 14.2: README/ARCHITECTURE must state the real workspace counts and
      # name every app and package — a new workspace fails CI until the docs
      # catch up (the Outpost apps were missing from both documents once).
      - name: README and ARCHITECTURE match the workspaces
        run: bun run check:workspace-counts

      # Req 14.9: relative links and anchors in Markdown must resolve; a moved
      # or renamed document fails CI instead of rotting silently. External URLs
      # are not fetched (CI stays network-independent for this gate).
      - name: Markdown links resolve
        run: bun run check:links

      # Req 15.5: the atf-verify CLI checks receipt signatures and Merkle
      # inclusion proofs fully offline; the end-to-end tests spawn the script
      # against generated fixtures and assert the exit codes.
      - name: atf-verify CLI tests and types
        run: |
          bun run atf-verify:test
          bun run atf-verify:typecheck
          bun test ./scripts/check-flow-versions.test.ts
          bun test ./scripts/bun-lock-identities.test.ts
          # Smoke test of the standalone binary the release workflow ships.
          bun run atf-verify:build
          ./dist/bin/atf-verify --help >/dev/null

      - name: Flow examples validate
        working-directory: apps/runtime
        run: bun run scripts/cli.ts validate ../../deploy/examples/flows/ --require-version

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    name: Test (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - "@atf/runtime"
          - "@atf/control"
          - "@atf/search"
          - "@atf/gate"
          - "@atf/extract"
          - "@atf/system-integration"
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg18
        env:
          POSTGRES_DB: atf_test
          POSTGRES_USER: atf
          POSTGRES_PASSWORD: atf-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atf -d atf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES_URL: postgres://atf:atf-ci-only@127.0.0.1:5432/atf_test
      POSTGRES_URL: postgres://atf:atf-ci-only@127.0.0.1:5432/atf_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run --filter ${{ matrix.workspace }} test

      # Req 13.7: per-file coverage gate for the security-critical runtime
      # modules (auth middleware, audit log, PII vault, tool authorization,
      # production readiness gate). Bun cannot report branch coverage, so the
      # gate enforces >= 90 % lines AND functions per file as a proxy — see
      # scripts/check-security-coverage.ts for the documented limitation.
      - name: Security module coverage gate
        if: matrix.workspace == '@atf/runtime'
        run: bun run coverage:security

  # Control's Playwright suite: navigation, SSE, CSP and token exposure, DSAR
  # and the full-page axe sweep (WCAG 2 A/AA, serious and critical). The specs
  # mock the Runtime with page.route, so only the built Control app runs.
  # Visual-regression specs are excluded: their baselines are recorded on
  # macOS and do not match Linux font rendering.
  control-e2e:
    name: Control E2E and a11y
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      # Enforce is the default; set explicitly so a runner-level override can
      # never turn the CSP spec into a no-op.
      CONTROL_CSP_MODE: enforce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: apps/control
        run: bunx playwright install --with-deps chromium
      - name: Build Control
        run: bun run --filter @atf/control build
      - name: Start Control
        working-directory: apps/control
        run: |
          nohup bun run start > control-server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3000/graph && exit 0
            sleep 1
          done
          cat control-server.log
          exit 1
      - name: Playwright (E2E and a11y sweep)
        working-directory: apps/control
        run: bunx playwright test --grep-invert "Visual regression"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: control-playwright-report
          path: |
            apps/control/playwright-report
            apps/control/test-results
            apps/control/control-server.log
          retention-days: 7

  contracts:
    name: Contract packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Contract package tests
        run: |
          for package in identity-contract transaction-contract evidence-contract \
                         schema-compatibility contract-adapter extract-contract \
                         security-kit erasure-contract observability \
                         canonical-json mcp-2026; do
            bun run --filter "@atf/$package" test
          done
      # Task 1.3: the egress-blockade property (Property 12) and the client
      # TLS test also run under Node, which strips TypeScript types itself.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Security kit under Node
        run: bun run --filter @atf/security-kit test:node
      - name: Cross-contract lifecycle
        run: bun run test:contracts

  # Requirement 10.6: the three Outpost packages plus cargo test, cargo audit and
  # cargo deny run as their own CI job so Rust regressions and security
  # advisories of the Tauri stack do not go unnoticed.
  outpost:
    name: Outpost
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile

      - name: outpost-core typecheck and tests
        run: |
          bun run --filter @atf/outpost-core typecheck
          bun run --filter @atf/outpost-core test
      - name: outpost typecheck and tests
        run: |
          bun run --filter @atf/outpost typecheck
          bun run --filter @atf/outpost test
      - name: outpost-desktop typecheck
        run: bun run --filter @atf/outpost-desktop typecheck
      # The desktop E2E test checks the UI's Control API access through mocked
      # routes; it runs against the Vite dev server in headless Chromium.
      - name: Install Playwright Chromium
        working-directory: apps/outpost-desktop
        run: bunx playwright install --with-deps chromium
      - name: outpost-desktop E2E
        working-directory: apps/outpost-desktop
        run: bun run test:a11y

      # cargo test compiles the Tauri core; the GTK/WebKit development
      # packages are the official Tauri v2 prerequisites on Ubuntu.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev
      - name: cargo fmt
        run: cargo fmt --manifest-path apps/outpost-desktop/src-tauri/Cargo.toml -- --check
      - name: cargo test
        run: cargo test --manifest-path apps/outpost-desktop/src-tauri/Cargo.toml
      # The repository's Actions allow-list only admits GitHub-owned and
      # verified actions, so the tools are installed from crates.io with
      # pinned versions and the committed lockfiles instead of a third-party
      # installer action.
      - name: Install cargo-deny and cargo-audit
        run: cargo install --locked cargo-deny@0.20.2 cargo-audit@0.22.2
      - name: cargo deny
        run: >
          cargo deny
          --config apps/outpost-desktop/src-tauri/deny.toml
          --manifest-path apps/outpost-desktop/src-tauri/Cargo.toml
          check
      - name: cargo audit
        run: cargo audit --file apps/outpost-desktop/src-tauri/Cargo.lock

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile

      - name: Build all workspaces
        env:
          NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:3000
        run: bun run build

      - name: Search Node.js artifact
        run: bun run --filter @atf/search build:node

      - name: Artifact size budgets
        run: bun run check:budgets:ci

  supply-chain-workspace:
    name: Workspace inventory (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-14
            platform: darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # Req 10.7: include the Cargo.lock dependencies in the inventory (see the hygiene job).
      - name: Fetch crate archives for the inventory
        run: cargo fetch --locked --manifest-path apps/outpost-desktop/src-tauri/Cargo.toml

      - name: Generate commit-specific workspace inventory
        run: >-
          bun run supply-chain --inventory-root "$GITHUB_WORKSPACE"
          --output-dir "$GITHUB_WORKSPACE/artifacts/workspace-${{ matrix.platform }}-${GITHUB_SHA}"
          --platform "${{ matrix.platform }}" --assert-host-platform
          --artifact-kind workspace --artifact-name "workspace-${{ matrix.platform }}-${GITHUB_SHA}"
          --git-sha "$GITHUB_SHA" --include-cargo

      - name: Check committed Linux reference byte-for-byte
        if: matrix.platform == 'linux-x64'
        run: >-
          bun run supply-chain:check --inventory-root "$GITHUB_WORKSPACE"
          --output-dir "$GITHUB_WORKSPACE" --platform linux-x64 --assert-host-platform
          --artifact-kind workspace --artifact-name workspace-linux-x64
          --git-sha unknown --include-cargo

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: workspace-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts/workspace-${{ matrix.platform }}-${{ github.sha }}
          retention-days: 90

  supply-chain-images:
    name: Quickstart image inventories
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build and extract final-target inventories
        run: >-
          bun run supply-chain:images --output-dir "$GITHUB_WORKSPACE/artifacts/images-linux-x64-${GITHUB_SHA}"
          --platform linux-x64 --git-sha "$GITHUB_SHA"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quickstart-runtime-linux-x64-${{ github.sha }}
          path: artifacts/images-linux-x64-${{ github.sha }}/runtime
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quickstart-control-linux-x64-${{ github.sha }}
          path: artifacts/images-linux-x64-${{ github.sha }}/control
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quickstart-search-linux-x64-${{ github.sha }}
          path: artifacts/images-linux-x64-${{ github.sha }}/search
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quickstart-gate-linux-x64-${{ github.sha }}
          path: artifacts/images-linux-x64-${{ github.sha }}/gate
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quickstart-extract-linux-x64-${{ github.sha }}
          path: artifacts/images-linux-x64-${{ github.sha }}/extract
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quickstart-image-index-linux-x64-${{ github.sha }}
          path: artifacts/images-linux-x64-${{ github.sha }}/index.json
          retention-days: 90

  # Helm chart (task 16.4, requirement 12.3): lint the umbrella chart and
  # validate every rendered manifest against the Kubernetes API schemas with
  # kubeconform in strict mode. Both tools are pinned by checksum, matching
  # the pinned-version style of the other supply-chain jobs.
  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HELM_VERSION: 4.3.0
      HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
      KUBECONFORM_VERSION: 0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install helm (pinned by checksum)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/helm.tar.gz \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tar.gz" | sha256sum --check
          tar -xzf /tmp/helm.tar.gz -C /tmp linux-amd64/helm
          install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Install kubeconform (pinned by checksum)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum --check
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

      - name: helm lint
        run: helm lint deploy/helm/atf

      - name: Render and validate with kubeconform (strict)
        run: |
          set -euo pipefail
          helm template atf deploy/helm/atf --namespace atf \
            --set global.secrets.runtime=atf-runtime \
            --set global.secrets.gate=atf-gate \
            --set global.secrets.search=atf-search \
            --set global.secrets.extract=atf-extract \
            --set global.secrets.control=atf-control \
            --set runtime.flowsConfigMap=atf-flows \
            --set gate.configMap=atf-gate-config \
            > /tmp/atf-rendered.yaml
          kubeconform -strict -summary /tmp/atf-rendered.yaml

      - name: Render autoscaling variant and validate
        run: |
          set -euo pipefail
          helm template atf deploy/helm/atf --namespace atf \
            --set global.secrets.runtime=atf-runtime \
            --set global.secrets.gate=atf-gate \
            --set global.secrets.search=atf-search \
            --set global.secrets.extract=atf-extract \
            --set global.secrets.control=atf-control \
            --set runtime.autoscaling.enabled=true \
            --set search.autoscaling.enabled=true \
            > /tmp/atf-autoscaling.yaml
          kubeconform -strict -summary /tmp/atf-autoscaling.yaml
          grep -q 'kind: HorizontalPodAutoscaler' /tmp/atf-autoscaling.yaml

      # The chart exports the declared replica count (REPLICAS, Gate:
      # MCPGATE_REPLICAS) so the production-readiness gates see the real
      # topology, and ATF_PROFILE only when global.profile is set.
      - name: Render declared replicas and profile
        run: |
          set -euo pipefail
          set_common=(
            --namespace atf
            --set global.secrets.runtime=atf-runtime
            --set global.secrets.gate=atf-gate
            --set global.secrets.search=atf-search
            --set global.secrets.extract=atf-extract
            --set global.secrets.control=atf-control
          )
          # Default: no profile exported, replicaCount (2) declared everywhere.
          helm template atf deploy/helm/atf "${set_common[@]}" > /tmp/atf-replicas-default.yaml
          if grep -q 'name: ATF_PROFILE' /tmp/atf-replicas-default.yaml; then
            echo "/tmp/atf-replicas-default.yaml must not contain name: ATF_PROFILE"; exit 1
          fi
          test "$(grep -A1 -E 'name: (MCPGATE_)?REPLICAS' /tmp/atf-replicas-default.yaml | grep -c 'value: "2"')" = 4
          # Autoscaling declares the HPA ceiling; global.profile reaches the four services.
          helm template atf deploy/helm/atf "${set_common[@]}" \
            --set runtime.autoscaling.enabled=true \
            --set search.autoscaling.enabled=true --set search.autoscaling.maxReplicas=7 \
            --set global.profile=staging > /tmp/atf-replicas-hpa.yaml
          kubeconform -strict -summary /tmp/atf-replicas-hpa.yaml
          grep -A1 'name: REPLICAS' /tmp/atf-replicas-hpa.yaml | grep -q 'value: "6"'
          grep -A1 'name: REPLICAS' /tmp/atf-replicas-hpa.yaml | grep -q 'value: "7"'
          test "$(grep -A1 'name: ATF_PROFILE' /tmp/atf-replicas-hpa.yaml | grep -c 'value: "staging"')" = 4
          # An unknown profile is rejected by the values schema, not by a crash-looping pod.
          if helm template atf deploy/helm/atf "${set_common[@]}" --set global.profile=prod > /dev/null 2>&1; then
            echo "global.profile=prod must be rejected"; exit 1
          fi
          # The Extract pod converts with an in-process LibreOffice, which the production gate
          # refuses without an acknowledgement: the chart exports it by default, and only Extract.
          test "$(grep -c 'name: CONVERTER_ALLOW_LOCAL_HTML' /tmp/atf-replicas-default.yaml)" = 1
          helm template atf deploy/helm/atf "${set_common[@]}" \
            --set extract.config.converterAllowLocalHtml=false > /tmp/atf-converter-off.yaml
          if grep -q 'CONVERTER_ALLOW_LOCAL_HTML' /tmp/atf-converter-off.yaml; then
            echo "/tmp/atf-converter-off.yaml must not contain CONVERTER_ALLOW_LOCAL_HTML"; exit 1
          fi
          # global.redis is off by default: nothing may export a Redis URL, so a
          # stock install stays honest about needing an explicit shared store.
          if grep -q 'RATE_LIMIT_REDIS_URL' /tmp/atf-replicas-default.yaml; then
            echo "default rendering must not export RATE_LIMIT_REDIS_URL"; exit 1
          fi
          # Enabled, it exports exactly one REDIS_URL (Runtime) and two
          # RATE_LIMIT_REDIS_URL (Search, Extract) from the referenced Secret.
          helm template atf deploy/helm/atf "${set_common[@]}" \
            --set global.redis.enabled=true --set global.redis.urlSecret.name=atf-redis \
            > /tmp/atf-redis.yaml
          kubeconform -strict -summary /tmp/atf-redis.yaml
          if [ "$(grep -c 'name: RATE_LIMIT_REDIS_URL' /tmp/atf-redis.yaml)" != "2" ]; then
            echo "expected exactly 2 RATE_LIMIT_REDIS_URL (search, extract)"; exit 1
          fi
          if [ "$(grep -c 'name: REDIS_URL' /tmp/atf-redis.yaml)" != "1" ]; then
            echo "expected exactly 1 REDIS_URL (runtime)"; exit 1
          fi
      - name: Render service TLS variant and validate
        run: |
          set -euo pipefail
          helm template atf deploy/helm/atf --namespace atf \
            --set global.secrets.runtime=atf-runtime \
            --set global.secrets.gate=atf-gate \
            --set global.secrets.search=atf-search \
            --set global.secrets.extract=atf-extract \
            --set global.secrets.control=atf-control \
            --set search.config.tls.secretName=atf-search-tls \
            --set extract.config.tls.secretName=atf-extract-tls \
            --set extract.config.searchTls=true \
            > /tmp/atf-tls.yaml
          kubeconform -strict -summary /tmp/atf-tls.yaml
          grep -q 'name: TLS_CERT_FILE' /tmp/atf-tls.yaml
          grep -q 'scheme: HTTPS' /tmp/atf-tls.yaml
          grep -q 'https://atf-search.atf.svc.cluster.local' /tmp/atf-tls.yaml

  compose:
    name: Quickstart stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compose file is valid
        run: |
          docker compose --env-file deploy/examples/.env.example \
            -f deploy/examples/compose.yaml config --quiet

      - name: Start the stack
        run: |
          docker compose --env-file deploy/examples/.env.example \
            -f deploy/examples/compose.yaml up --build -d --wait --wait-timeout 600

      - name: Smoke the documented endpoints
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:3000/health/ready > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3002/health > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3003/readyz > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3001/ > /dev/null
          curl --fail-with-body --silent --show-error \
            http://127.0.0.1:3000/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"quickstart","messages":[{"role":"user","content":"Confirm the quickstart."}]}'

      # Task 16.5 (requirements 12.6/12.7): the converter is part of the
      # quickstart, so the smoke must prove an end-to-end conversion, not just
      # a healthy port. A minimal one-page PDF goes through Extract's
      # /v1/convert (poppler text path, no vision needed for text output) and
      # through Search's /ingest-file proxy, which starts an Extract v2 job —
      # covering the Search -> Extract hop the documented stack relies on.
      - name: Smoke the conversion path
        run: |
          set -euo pipefail
          python3 - <<'PY'
          def obj(n, body):
              return f"{n} 0 obj\n{body}\nendobj\n".encode()

          text = b"BT /F1 24 Tf 72 720 Td (Quickstart conversion smoke) Tj ET"
          stream_body = b"<< /Length " + str(len(text)).encode() + b" >>\nstream\n" + text + b"\nendstream"
          header = b"%PDF-1.4\n"
          objs = [
              obj(1, "<< /Type /Catalog /Pages 2 0 R >>"),
              obj(2, "<< /Type /Pages /Kids [3 0 R] /Count 1 >>"),
              obj(3, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] "
                     "/Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>"),
              obj(4, stream_body.decode("latin-1")),
              obj(5, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>"),
          ]
          out = header + b"".join(objs)
          xref_pos = len(out)
          xref = b"xref\n0 6\n0000000000 65535 f \n"
          offset = len(header)
          for o in objs:
              xref += b"%010d 00000 n \n" % offset
              offset += len(o)
          out += xref + b"trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n" + str(xref_pos).encode() + b"\n%%EOF\n"
          open("/tmp/smoke.pdf", "wb").write(out)
          PY
          curl --fail-with-body --silent --show-error \
            http://127.0.0.1:3004/v1/convert \
            -H 'Content-Type: application/pdf' -H 'Accept: text/markdown' \
            --data-binary @/tmp/smoke.pdf | grep -qi 'Quickstart conversion smoke'
          curl --fail-with-body --silent --show-error \
            http://127.0.0.1:3002/ingest-file \
            -H 'Content-Type: application/pdf' \
            --data-binary @/tmp/smoke.pdf

      - name: Logs on failure
        if: failure()
        run: |
          docker compose --env-file deploy/examples/.env.example \
            -f deploy/examples/compose.yaml logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: |
          docker compose --env-file deploy/examples/.env.example \
            -f deploy/examples/compose.yaml down --volumes

  # Retrieval eval against REAL models (task 6.11, requirements 4.9/4.10): the
  # quickstart compose stack only proves plumbing (constant-vector mock), so
  # this job runs scripts/eval/compose.eval.yaml — Search, Extract, TEI-CPU
  # embedding (bge-m3), TEI-CPU cross-encoder rerank and a deterministic
  # HyDE mock — ingests the deterministic golden corpus and gates the baseline
  # against scripts/eval/baseline/thresholds.json. Reports land in artifacts,
  # never in the tree, so the committed baseline stays stable.
  eval:
    name: Retrieval eval (real models)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      - name: Eval harness tests and types
        run: |
          bun run eval:test
          bun run eval:typecheck

      - name: Start the eval stack
        run: >-
          docker compose -f scripts/eval/compose.eval.yaml up --build -d --wait
          --wait-timeout 600

      - name: Build and ingest the golden corpus
        run: |
          set -euo pipefail
          bun run scripts/eval/golden-set/build-corpus.ts
          bun run scripts/eval/ingest-corpus.ts --collection golden \
            --base-url http://127.0.0.1:3012

      - name: Baseline run with thresholds gate
        run: >-
          bun run scripts/eval/retrieval.ts --collection golden
          --base-url http://127.0.0.1:3012 --k 5,10 --label baseline
          --out reports/eval/retrieval
          --thresholds scripts/eval/baseline/thresholds.json

      - name: Ablations (dense, rerank, hyde)
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3012
          bun run scripts/eval/retrieval.ts --collection golden --base-url "$base" \
            --search-mode dense --label ablation-dense --out reports/eval/retrieval
          bun run scripts/eval/retrieval.ts --collection golden --base-url "$base" \
            --rerank --label ablation-rerank --out reports/eval/retrieval
          bun run scripts/eval/retrieval.ts --collection golden --base-url "$base" \
            --hyde --label ablation-hyde --out reports/eval/retrieval

      - name: Contextual-header ablation (v2 revision ingest)
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3012
          bun run scripts/eval/ingest-corpus.ts --v2 --collection golden_ctx \
            --base-url "$base"
          bun run scripts/eval/retrieval.ts --v2 --collection golden_ctx \
            --base-url "$base" --label ablation-ctx-header \
            --out reports/eval/retrieval

      - name: Upload eval reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: eval-reports-${{ github.sha }}
          path: reports/eval/
          retention-days: 30

      - name: Logs on failure
        if: failure()
        run: >-
          docker compose -f scripts/eval/compose.eval.yaml logs --no-color
          --tail 200

      - name: Tear down
        if: always()
        run: >-
          docker compose -f scripts/eval/compose.eval.yaml down --volumes

  # Requirement 13.3: secret scanning over the full git history. The binary is
  # pinned by version and checksum instead of a third-party action, matching
  # the pinned-tool style of the other supply-chain jobs. The allowlist in
  # .gitleaks.toml covers only hand-verified synthetic test fixtures.
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install gitleaks (pinned by checksum)
        run: |
          set -euo pipefail
          version=8.30.1
          expected=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive=gitleaks_${version}_linux_x64.tar.gz
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "${expected}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner

  # Requirement 13.2: the five production images are built from the same
  # Dockerfiles the release workflow publishes and scanned with Trivy; the
  # job fails on critical CVEs. ignore-unfixed is enabled deliberately:
  # distroless/slim bases frequently carry criticals with no released fix,
  # which cannot be actioned in a PR. Unfixed criticals are handled by the
  # Dependabot digest bumps on the pinned base images, and the release
  # workflow's signed SBOMs give the full inventory for audits.
  image-scan:
    name: Image scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Upload of the HIGH findings to code scanning; upload-sarif also needs
      # actions: read in private repositories.
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [runtime, search, gate, extract, control]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Build image
        run: >-
          docker build --platform linux/amd64
          --file deploy/images/Dockerfile.${{ matrix.service }}
          --tag atf-scan-${{ matrix.service }}:latest .

      - name: Install Trivy (pinned by checksum)
        run: |
          set -euo pipefail
          version=0.75.0
          expected=c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
          archive=trivy_${version}_Linux-64bit.tar.gz
          curl -fsSL -o "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${version}/${archive}"
          echo "${expected}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" trivy
          sudo install trivy /usr/local/bin/trivy
          trivy --version

      - name: Scan image (fail on critical CVEs)
        run: >-
          trivy image --scanners vuln --severity CRITICAL
          --exit-code 1 --ignore-unfixed --slow --timeout 20m
          atf-scan-${{ matrix.service }}:latest

      # HIGH findings do not fail the build; they are uploaded so they are
      # visible, deduplicated and trackable in code scanning.
      - name: Scan image (HIGH findings as SARIF, non-blocking)
        run: >-
          trivy image --scanners vuln --severity HIGH
          --format sarif --output trivy-${{ matrix.service }}.sarif
          --exit-code 0 --ignore-unfixed --slow --timeout 20m
          atf-scan-${{ matrix.service }}:latest

      - name: Upload HIGH findings to code scanning
        # A pull request from a fork gets a read-only token and cannot upload.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        # Non-blocking by design: without code scanning enabled for the
        # repository the upload API rejects the file; the CRITICAL scan above
        # stays the hard gate.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}

  # Requirement 13.3: SAST over the TypeScript workspaces and the Rust
  # Tauri core. Both run build-mode none (the only mode CodeQL supports for
  # Rust); the Rust extractor still runs the crates' build scripts through
  # rust-analyzer, so the GTK/WebKit prerequisites mirror the outpost job.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # CodeQL language identifiers: `javascript-typescript` is the
        # upstream alias for the JavaScript/TypeScript extractor.
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      # One language per job (the matrix); the paths come from the
      # per-language config file. `languages` and `build-mode` are inputs of
      # the init action — the repository-root action is only a failing stub.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: .github/codeql/codeql-${{ matrix.language == 'rust' && 'rust' || 'typescript' }}.yml

      - name: Install Tauri system dependencies
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
