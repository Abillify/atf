# ATF umbrella chart values (requirement 12.3).
#
# The chart renders the five ATF services (runtime, gate, search, extract,
# control) plus their Services, PDBs, optional HPAs, NetworkPolicies and
# migration hook Jobs. It ships no PostgreSQL and no model serving: point
# the database and model URLs at managed/external instances through the
# per-service Secrets named below.
#
# Secrets are references, never values: global.secrets.<service> names an
# EXISTING Kubernetes Secret (created out-of-band, e.g. by Sealed Secrets,
# External Secrets or SOPS). The chart only references it via envFrom, and
# the migration Jobs read their database URL from it via secretKeyRef.

global:
  nameOverride: ""
  fullnameOverride: ""

  image:
    # Registry prefix for all five service images (ghcr.io/abillify/atf-*).
    registry: ghcr.io/abillify
    # Shared tag; empty means each chart's appVersion (the product version).
    # Ignored for any service whose image.digest is pinned.
    tag: ""
    pullPolicy: IfNotPresent

  # List of {name: <pull-secret>} for a private registry.
  imagePullSecrets: []
  # Operating profile for Runtime, Gate, Search and Extract, exported as
  # ATF_PROFILE (development | staging | production | test). Empty = not set:
  # each service then judges by its own variable (runtime.config.appEnv,
  # gate.config.env, the image's NODE_ENV). When set it WINS over those, and an
  # unknown value stops the service from starting.
  profile: ""

  # Existing Secrets per service (see above). The keys double as the
  # service names, so the schema keeps them closed:
  #   runtime  -> DATABASE_URL (+ OIDC/authn/authz material)
  #   gate     -> upstream credentials referenced by its config.yaml
  #   search   -> POSTGRES_URL, EMBED_*, optional RERANK_*, CONVERTER_TOKEN
  #   extract  -> EXTRACT_DATABASE_URL, VISION_*
  #   control  -> session/OIDC material
  secrets:
    runtime: ""
    gate: ""
    search: ""
    extract: ""
    control: ""

  # Shared Redis for the rate limiters and the approval/transaction store.
  # The chart ships no Redis of its own (no subchart dependency): point it at
  # an EXISTING Secret holding the connection URL, the same way the per-service
  # Secrets above are references rather than values.
  #
  # Runtime reads REDIS_URL, Search and Extract read RATE_LIMIT_REDIS_URL. The
  # Gate keeps getting Redis through its own config.yaml
  # (server.rateLimit.store, monitoring.cluster) or MCPGATE_TRANSACTION_REDIS_URL
  # in the Gate Secret - this block does not touch the Gate.
  #
  # Needed as soon as more than one Search/Extract replica runs: the production
  # gate refuses to start those services with REPLICAS > 1 and no shared
  # Redis. The chart's replicaCount defaults declare two replicas, so a
  # production install needs either this block or RATE_LIMIT_REDIS_URL in the
  # Search and Extract Secrets.
  redis:
    # true exports the URL below to Runtime (REDIS_URL) and to Search and
    # Extract (RATE_LIMIT_REDIS_URL) via secretKeyRef.
    enabled: false
    urlSecret:
      # Name of the existing Secret holding the URL. Required when enabled.
      name: ""
      # Key inside that Secret whose value is the redis[s]://... URL.
      key: url

  # Annotations merged into every pod template (e.g. checksum annotations
  # for externally managed ConfigMaps).
  podAnnotations: {}

  # Scheduling defaults, overridable per service.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

runtime:
  # ConfigMap with the flow definitions (mounted at /config/flows).
  flowsConfigMap: ""

gate:
  # ConfigMap with the Gate configuration (mounted at /config); the Gate
  # refuses to start without it.
  configMap: ""
