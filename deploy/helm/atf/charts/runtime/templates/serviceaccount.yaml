{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "atf.serviceAccountName" (dict "ctx" . "Component" "runtime" "Values" .Values) }}
  labels:
    {{- include "atf.labels" (dict "ctx" . "name" "runtime") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
