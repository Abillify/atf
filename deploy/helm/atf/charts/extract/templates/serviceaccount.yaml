{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "atf.serviceAccountName" (dict "ctx" . "Component" "extract" "Values" .Values) }}
  labels:
    {{- include "atf.labels" (dict "ctx" . "name" "extract") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
