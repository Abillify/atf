[package]
name = "atf-outpost-desktop"
version = "0.1.0"
description = "ATF Extract Outpost desktop host"
authors = ["Abillify Technology GmbH"]
edition = "2021"
license = "Elastic-2.0"

[lib]
name = "atf_outpost_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1" }

[dependencies]
tauri = { version = "2.8.1", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3.4"
keyring = "4.2.0"
tauri-plugin-dialog = "2.4.0"
tauri-plugin-autostart = "2.5.0"
tauri-plugin-notification = "2.3.1"
tauri-plugin-updater = "2.9.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
proptest = "1.6.0"
