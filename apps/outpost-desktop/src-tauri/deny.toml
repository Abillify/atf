#
# Configuration for cargo-deny (Requirement 10.6, Task 14.4).
# Applies to the Rust part of Outpost Desktop (src-tauri).

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
]

[licenses]
# Only explicitly approved licenses; unknown or copyleft licenses that
# are not listed in allow are reported as errors by cargo-deny (default in
# cargo-deny >= 0.16: unlisted licenses are rejected).
confidence-threshold = 0.93
allow = [
    "Elastic-2.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eedfa }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
# Treat yanked crates as errors as well.
yanked = "deny"
# zip 4.6.1 reaches the app only on Windows, through tauri-plugin-updater's
# `zip` feature; zip >= 9 needs tauri-plugin-updater 3 (alpha only). The
# updater verifies the Minisign signature before it unpacks an update, so no
# attacker-controlled archive reaches extraction, and the app ships no updater
# artifacts (`createUpdaterArtifacts: false`). Keep in sync with the
# `cargo audit --ignore` list in .github/workflows/ci.yml; drop these entries
# once a stable updater release depends on zip >= 9.
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip extraction only after updater signature verification; no zip >= 9 for tauri-plugin-updater 2.x" },
    { id = "RUSTSEC-2026-0368", reason = "zip extraction only after updater signature verification; no zip >= 9 for tauri-plugin-updater 2.x" },
    { id = "RUSTSEC-2026-0369", reason = "zip extraction only after updater signature verification; no zip >= 9 for tauri-plugin-updater 2.x" },
]
